name: Build Hybrid Kick EQ

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar el proyecto con CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Compilar (Release)
        run: cmake --build build --config Release --parallel

      - name: Subir el VST3/Standalone compilado
        uses: actions/upload-artifact@v4
        with:
          name: HybridKickEQ-Windows
          path: |
            build/HybridKickEQ_artefacts/Release/VST3/**
            build/HybridKickEQ_artefacts/Release/Standalone/**
